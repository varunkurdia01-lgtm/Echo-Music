name: Build ARM64 Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ARM64 Debug APK
        run: |
          ./gradlew assembleArm64GmsDebug \
            --no-daemon \
            --console=plain \
            --warning-mode=none \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" \
            > build.log 2>&1 || {
              echo "=== BUILD FAILED (LAST 80 LINES) ==="
              tail -n 80 build.log
              exit 1
            }
          echo "=== BUILD SUCCEEDED ==="

      - name: Show Short Error Summary on Failure
        if: failure()
        run: |
          echo "### Exact Build Error" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |FAILURE:|What went wrong|Caused by:|OutOfMemoryError|Exception" build.log | tail -n 40 >> "$GITHUB_STEP_SUMMARY" || true
          echo "--- LAST 50 LINES ---" >> "$GITHUB_STEP_SUMMARY"
          tail -n 50 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Neumorphic-ARM64-Debug
          path: app/build/outputs/apk/**/*.apk
